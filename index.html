<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="마음쓰임은 외로움과 감정을 연구하며, 숲과 예술로 관계를 잇습니다.">
<title>마음쓰임 | Mind Tools Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Noto Sans KR', sans-serif; color: #332B45; background: #F5F1FC; overflow-x: hidden; }

  /* 추상 배경 그라데이션 */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 70% 50% at 5% 15%, rgba(160,110,240,0.35) 0%, transparent 55%),
      radial-gradient(ellipse 55% 70% at 95% 5%, rgba(120,80,210,0.28) 0%, transparent 50%),
      radial-gradient(ellipse 65% 45% at 70% 85%, rgba(190,140,255,0.22) 0%, transparent 55%),
      radial-gradient(ellipse 45% 55% at 80% 50%, rgba(140,90,220,0.18) 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 30% 60%, rgba(170,120,245,0.15) 0%, transparent 50%),
      #F5F1FC;
    pointer-events: none;
  }

  /* NAV */
  .nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 60px;
    background: rgba(245,241,252,0.96); backdrop-filter: blur(10px);
    border-bottom: 1px solid #EFE6E0;
  }
  .nav .logo img { height: 36px; width: auto; filter: brightness(0) saturate(100%) invert(22%) sepia(60%) saturate(800%) hue-rotate(240deg) brightness(80%); }
  .nav .menu { display: flex; gap: 36px; }
  .nav .menu a { font-size: 15px; color: #665E78; font-weight: 500; text-decoration: none; transition: color 0.2s; }
  .nav .menu a:hover { color: #5B3E96; }

  /* HERO — 비대칭 타이포 레이아웃 */
  .hero {
    min-height: 90vh;
    padding: 80px 60px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    max-width: 1300px;
    margin: 0 auto;
  }
  .hero-left { padding-right: 40px; }
  .hero-tag {
    display: inline-block; font-size: 13px; font-weight: 500;
    color: #8A6BC8; background: #F0EBFA;
    padding: 6px 16px; border-radius: 999px; margin-bottom: 36px;
    letter-spacing: 1px;
  }
  .hero-left h1 {
    font-size: 52px; line-height: 1.45;
    color: #2A1F40; margin-bottom: 0;
    letter-spacing: -0.5px;
  }
  .hero-left h1 .bold {
    font-weight: 900; color: #5B3E96;
  }
  .hero-left h1 .thin {
    font-weight: 300; color: #766E80;
  }
  .hero-sub {
    margin-top: 40px;
    font-size: 16px; color: #766E80; line-height: 1.8; font-weight: 400;
    max-width: 400px;
  }
  .hero-cta {
    display: inline-block; margin-top: 40px;
    background: #5B3E96; color: #fff;
    font-size: 15px; font-weight: 700; padding: 14px 36px;
    border-radius: 999px; text-decoration: none; transition: background 0.2s;
  }
  .hero-cta:hover { background: #4A3080; }

  /* HERO RIGHT — 슬라이드쇼 */
  .hero-right { position: relative; }
  .slideshow {
    border-radius: 24px; overflow: hidden;
    aspect-ratio: 4/3;
    background: #3D2A6B;
    position: relative;
  }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: flex-end;
    padding: 40px;
    opacity: 0; transition: opacity 0.8s ease;
  }
  .slide.active { opacity: 1; }
  .slide-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .slide-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(30,15,60,0.85) 0%, rgba(30,15,60,0.1) 60%);
  }
  .slide-content { position: relative; z-index: 1; }
  .slide-num { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 8px; letter-spacing: 2px; }
  .slide-title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .slide-sub { font-size: 14px; color: rgba(255,255,255,0.7); }

  /* 슬라이드 색상 (이미지 없을 때 placeholder) */
  .slide:nth-child(1) .slide-bg { background: linear-gradient(135deg, #5B3E96, #8A6BC8); }
  .slide:nth-child(2) .slide-bg { background: linear-gradient(135deg, #8A6BC8, #E8694A); }
  .slide:nth-child(3) .slide-bg { background: linear-gradient(135deg, #3D2A6B, #6B4FA0); }
  .slide:nth-child(4) .slide-bg { background: linear-gradient(135deg, #E8694A, #5B3E96); }
  .slide:nth-child(5) .slide-bg { background: linear-gradient(135deg, #6B4FA0, #C8A0E8); }
  .slide:nth-child(6) .slide-bg { background: linear-gradient(135deg, #4A3080, #E8694A); }

  .slide-dots {
    display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: #D4C2EC; cursor: pointer; transition: all 0.3s;
    border: none;
  }
  .dot.active { background: #5B3E96; width: 24px; }

  /* SECTION */
  .section { padding: 100px 60px; max-width: 1200px; margin: 0 auto; }
  .section-label { font-size: 13px; font-weight: 700; color: #E8694A; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }

  /* 프로그램 — 비대칭 */
  .programs-layout { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
  .programs-left h2 { font-size: 36px; font-weight: 900; color: #5B3E96; line-height: 1.3; }
  .programs-left p { margin-top: 20px; font-size: 15px; color: #766E80; line-height: 1.8; }
  .program-list { display: flex; flex-direction: column; gap: 2px; }
  .program-item {
    padding: 28px 32px; border-radius: 16px;
    background: #fff; border: 1px solid #EFE6E0;
    transition: all 0.2s; cursor: default;
    display: flex; align-items: center; gap: 24px;
  }
  .program-item:hover { background: #F8F4FF; border-color: #D4C2EC; transform: translateX(8px); }
  .program-num { font-size: 13px; color: #C4B0E0; font-weight: 700; min-width: 28px; }
  .program-info h3 { font-size: 20px; font-weight: 700; color: #5B3E96; margin-bottom: 6px; }
  .program-info p { font-size: 14px; color: #766E80; line-height: 1.6; }

  /* PROGRAM CARDS — 밑미 스타일 카드형 프로그램 */
  .program-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .program-card {
    background: #fff; border-radius: 20px; overflow: hidden;
    border: 1px solid #EFE6E0; transition: transform 0.25s, box-shadow 0.25s;
  }
  .program-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(91,62,150,0.15); }
  .program-card-img {
    aspect-ratio: 4/3; display: flex; align-items: flex-end;
    padding: 20px; position: relative;
  }
  .program-card.c1 .program-card-img { background: linear-gradient(160deg, #7B5EC8 0%, #4A2E80 100%); }
  .program-card.c2 .program-card-img { background: linear-gradient(160deg, #C87B5E 0%, #8A4A2E 100%); }
  .program-card.c3 .program-card-img { background: linear-gradient(160deg, #5E8AC8 0%, #2E4A8A 100%); }
  .program-card-tag {
    position: absolute; top: 20px; left: 20px;
    font-size: 12px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,0.22); padding: 5px 14px; border-radius: 999px;
  }
  .program-card-body { padding: 24px; }
  .program-card-body h3 { font-size: 19px; font-weight: 700; color: #2A1F40; margin-bottom: 10px; }
  .program-card-body p { font-size: 14px; color: #766E80; line-height: 1.7; margin-bottom: 18px; }
  .program-card-cta { font-size: 14px; font-weight: 700; color: #5B3E96; text-decoration: none; }
  .program-card-cta:hover { text-decoration: underline; }

  /* CONTENT SQUARE — 밑미 콘텐츠 스퀘어 스타일 */
  .content-tabs { display: flex; gap: 10px; margin-bottom: 36px; flex-wrap: wrap; }
  .content-tab {
    padding: 9px 22px; border-radius: 999px; border: 1.5px solid #D4C2EC;
    background: #fff; color: #5B3E96; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .content-tab:hover { background: #F0EBFA; }
  .content-tab.active { background: #5B3E96; color: #fff; border-color: #5B3E96; }
  .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .content-card {
    background: #fff; border-radius: 16px; overflow: hidden;
    border: 1px solid #EFE6E0; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none; color: inherit; display: block;
  }
  .content-card.hidden { display: none; }
  .content-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(91,62,150,0.12); }
  .content-card-img {
    aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600;
  }
  .content-card.k1 .content-card-img { background: linear-gradient(135deg, #8A6BC8, #5B3E96); }
  .content-card.k2 .content-card-img { background: linear-gradient(135deg, #E8A88B, #C8694A); }
  .content-card.k3 .content-card-img { background: linear-gradient(135deg, #6B4FA0, #3D2A6B); }
  .content-card.k4 .content-card-img { background: linear-gradient(135deg, #C8A0E8, #8A6BC8); }
  .content-card.k5 .content-card-img { background: linear-gradient(135deg, #E8694A, #8A4A2E); }
  .content-card.k6 .content-card-img { background: linear-gradient(135deg, #5E8AC8, #2E4A8A); }
  .content-card-body { padding: 22px; }
  .content-cat { font-size: 12px; font-weight: 700; color: #E8694A; letter-spacing: 0.5px; margin-bottom: 10px; }
  .content-card-body h4 { font-size: 16px; font-weight: 700; color: #2A1F40; line-height: 1.55; margin-bottom: 12px; }
  .content-date { font-size: 12px; color: #9B8AA8; }

  /* PARTNER MARQUEE — 교차 스크롤 로고 */
  .partners-section { padding: 70px 0; overflow: hidden; }
  .partners-label { text-align: center; margin-bottom: 32px; }
  .marquee-track { display: flex; gap: 20px; width: max-content; }
  .marquee-track.row1 { animation: marqueeLeft 32s linear infinite; margin-bottom: 20px; }
  .marquee-track.row2 { animation: marqueeRight 32s linear infinite; }
  @keyframes marqueeLeft { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes marqueeRight { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  .partner-badge {
    padding: 13px 30px; background: #fff; border: 1px solid #EFE6E0;
    border-radius: 999px; font-size: 14px; font-weight: 700; color: #766E80;
    white-space: nowrap; flex-shrink: 0;
  }

  /* FAQ */
  .faq-list { display: flex; flex-direction: column; gap: 12px; max-width: 800px; }
  .faq-item { border: 1px solid #EFE6E0; border-radius: 16px; background: #fff; overflow: hidden; }
  .faq-question {
    padding: 22px 28px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-size: 16px; font-weight: 700; color: #2A1F40;
  }
  .faq-icon { font-size: 22px; color: #5B3E96; transition: transform 0.25s; flex-shrink: 0; margin-left: 20px; }
  .faq-item.open .faq-icon { transform: rotate(45deg); }
  .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; padding: 0 28px; }
  .faq-item.open .faq-answer { max-height: 300px; padding-bottom: 24px; }
  .faq-answer p { font-size: 14px; color: #766E80; line-height: 1.85; }

  /* ARCHIVE — 풀블리드 */
  .archive-section {
    background: linear-gradient(135deg, #7B5EC8 0%, #9B6EC8 40%, #D4786A 100%);
    padding: 56px 60px;
  }
  .archive-inner { max-width: 1200px; margin: 0 auto; }
  .archive-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
  .archive-header .section-label { color: #E8A88B; }
  .archive-header h2 { font-size: 32px; font-weight: 900; color: #fff; margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .stat { background: rgba(255,255,255,0.18); border-radius: 16px; padding: 24px 28px; text-align: center; }
  .stat .num { font-size: 44px; font-weight: 900; color: #FFFFFF; margin-bottom: 6px; line-height: 1; }
  .stat .num.small { font-size: 34px; }
  .stat .unit { font-size: 16px; font-weight: 300; color: rgba(255,255,255,0.75); }
  .stat .label { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.5; margin-top: 10px; }

  /* GALLERY — 비대칭 그리드 */
  .gallery-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
  .gallery-header h2 { font-size: 38px; font-weight: 900; color: #5B3E96; }
  .more-btn {
    border: 1.5px solid #5B3E96; color: #5B3E96;
    font-size: 14px; font-weight: 700; padding: 10px 22px;
    border-radius: 999px; text-decoration: none; transition: all 0.2s;
  }
  .more-btn:hover { background: #5B3E96; color: #fff; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto auto;
    gap: 16px;
  }
  .gallery-item {
    border-radius: 16px; overflow: hidden;
    cursor: pointer; aspect-ratio: 2/3;
    position: relative; transition: transform 0.25s, box-shadow 0.25s;
  }
  .gallery-item:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(91,62,150,0.18); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-ph {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: flex-end;
    padding: 24px;
  }
  .gallery-item.p1 .gallery-ph { background: linear-gradient(160deg, #7B5EC8 0%, #4A2E80 100%); }
  .gallery-item.p2 .gallery-ph { background: linear-gradient(160deg, #C87B5E 0%, #8A4A2E 100%); }
  .gallery-item.p3 .gallery-ph { background: linear-gradient(160deg, #5E8AC8 0%, #2E4A8A 100%); }
  .gallery-item.p4 .gallery-ph { background: linear-gradient(160deg, #C8A05E 0%, #8A6A2E 100%); }
  .gallery-item.p5 .gallery-ph { background: linear-gradient(160deg, #6AC87B 0%, #2E8A3A 100%); }
  .gallery-item.p6 .gallery-ph { background: linear-gradient(160deg, #C85E8A 0%, #8A2E5A 100%); }
  .ph-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .ph-year { font-size: 13px; color: rgba(255,255,255,0.65); }
  .gallery-overlay {
    position: absolute; inset: 0;
    background: rgba(91,62,150,0.8);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s;
  }
  .gallery-item:hover .gallery-overlay { opacity: 1; }
  .gallery-overlay span { color: #fff; font-size: 15px; font-weight: 700; }

  /* MODAL */
  .modal-bg {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(20,10,40,0.88); backdrop-filter: blur(8px);
    align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: 24px; padding: 48px;
    max-width: 860px; width: 90%; max-height: 90vh; overflow-y: auto;
    position: relative;
  }
  .modal-close { position: absolute; top: 20px; right: 24px; font-size: 26px; color: #aaa; cursor: pointer; background: none; border: none; }
  .modal-close:hover { color: #5B3E96; }
  .modal-title { font-size: 28px; font-weight: 900; color: #5B3E96; margin-bottom: 6px; }
  .modal-sub { font-size: 14px; color: #E8694A; font-weight: 600; margin-bottom: 28px; }
  .modal-photos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .modal-photo { border-radius: 12px; aspect-ratio: 4/3; background: #F0EBFA; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8A6BC8; overflow: hidden; }
  .modal-photo img { width: 100%; height: 100%; object-fit: cover; }
  .modal-desc { margin-top: 24px; font-size: 15px; color: #766E80; line-height: 1.8; }

  /* FOOTER */
  .footer { background: #2A1F40; color: #FBF6F3; padding: 80px 60px; }
  .footer-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: end; }
  .footer-left h2 { font-size: 34px; font-weight: 900; margin-bottom: 16px; line-height: 1.4; }
  .footer-left p { font-size: 15px; color: #C4B0E0; line-height: 1.8; margin-bottom: 32px; }
  .footer .contact {
    display: inline-block; background: #E8694A; color: #fff;
    font-size: 15px; font-weight: 700; padding: 14px 36px;
    border-radius: 999px; text-decoration: none; transition: background 0.2s;
  }
  .footer .contact:hover { background: #D45A3B; }
  .footer-right { text-align: right; }
  .footer-logo img { height: 32px; filter: brightness(0) invert(1) opacity(0.5); margin-bottom: 16px; }
  .footer-small { font-size: 13px; color: #6B5E80; line-height: 1.8; }
  .social-links { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
  .social-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08); color: #9B8AC0;
    transition: background 0.2s, color 0.2s;
    text-decoration: none;
  }
  .social-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }

  /* MOBILE */
  @media (max-width: 900px) {
    .nav { padding: 18px 24px; }
    .nav .menu { display: none; }
    .hero { grid-template-columns: 1fr; padding: 60px 24px 40px; min-height: auto; gap: 40px; }
    .hero-left h1 { font-size: 34px; }
    .programs-layout { grid-template-columns: 1fr; gap: 40px; }
    .program-grid { grid-template-columns: 1fr; }
    .content-grid { grid-template-columns: 1fr; }
    .archive-section { padding: 40px 24px; }
    .stats { grid-template-columns: 1fr; }
    .section { padding: 60px 24px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .footer-inner { grid-template-columns: 1fr; }
    .footer-right { text-align: left; }
    .footer { padding: 60px 24px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="#">
    <img src="logo.png" alt="마음쓰임">
  </a>
  <div class="menu">
    <a href="#programs">핵심 사업</a>
    <a href="#archive">아카이브</a>
    <a href="#content">콘텐츠</a>
    <a href="#projects">프로젝트</a>
    <a href="#faq">FAQ</a>
    <a href="#contact">문의</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-left">
    <div class="hero-tag" id="heroTag">Mind Tools Lab</div>
    <h1 id="heroTitle"></h1>
    <a href="#contact" class="hero-cta" id="heroCta">협업 제안하기</a>
  </div>
  <div class="hero-right">
    <div class="slideshow" id="slideshow">
    </div>
    <div class="slide-dots" id="slideDots">
    </div>
  </div>
</div>

<!-- PROGRAMS -->
<div class="section" id="programs">
  <div class="programs-layout">
    <div class="programs-left">
      <div class="section-label">Our Programs</div>
      <h2>핵심 사업 & 브랜드</h2>
    </div>
    <div class="program-grid" id="programGrid">
    </div>
  </div>
</div>

<!-- ARCHIVE -->
<div class="archive-section" id="archive">
  <div class="archive-inner">
    <div class="archive-header">
      <div>
        <div class="section-label">Archive</div>
        <h2>숫자로 보는 외로움 아카이브</h2>
      </div>
    </div>
    <div class="stats" id="archiveStats">
    </div>
  </div>
</div>

<!-- CONTENT SQUARE -->
<div class="section" id="content">
  <div class="gallery-header">
    <div>
      <div class="section-label">Mindtoolslab Contents</div>
      <h2>마음쓰임 이야기</h2>
    </div>
  </div>
  <div class="content-tabs">
    <button class="content-tab active" data-filter="all" onclick="filterContent('all', this)">전체</button>
    <button class="content-tab" data-filter="story" onclick="filterContent('story', this)">외로움 이야기</button>
    <button class="content-tab" data-filter="field" onclick="filterContent('field', this)">현장 리포트</button>
    <button class="content-tab" data-filter="interview" onclick="filterContent('interview', this)">인터뷰</button>
  </div>
  <div class="content-grid" id="contentGrid">
    <div class="content-loading" style="grid-column:1/-1;text-align:center;color:#9B8AA8;padding:40px 0;">콘텐츠를 불러오는 중...</div>
  </div>
</div>

<!-- GALLERY -->
<div class="section" id="projects">
  <div class="gallery-header">
    <div>
      <div class="section-label">Projects</div>
      <h2>진행된 프로젝트</h2>
    </div>
    <a href="#" class="more-btn">더보기 +</a>
  </div>
  <div class="gallery-grid" id="galleryGrid">
  </div>
</div>

<!-- MODALS -->
<div id="modalsContainer"></div>

<!-- PARTNERS MARQUEE -->
<div class="partners-section">
  <div class="partners-label">
    <div class="section-label" style="text-align:center;">Collaborators</div>
  </div>
  <div class="marquee-track row1" id="partnersRow1">
  </div>
  <div class="marquee-track row2" id="partnersRow2">
  </div>
</div>

<!-- FAQ -->
<div class="section" id="faq">
  <div class="section-label">FAQ</div>
  <h2 style="font-size:38px;font-weight:900;color:#5B3E96;margin-bottom:40px;">자주 묻는 질문</h2>
  <div class="faq-list" id="faqList">
  </div>
</div>

<!-- FOOTER -->
<div class="footer" id="contact">
  <div class="footer-inner">
    <div class="footer-left">
      <h2 id="footerTitle"></h2>
      <p id="footerDesc"></p>
      <a href="mailto:mindtoolslab@gmail.com" class="contact" id="footerEmailLink">이메일 문의하기</a>
    </div>
    <div class="footer-right">
      <div class="footer-logo"><img src="logo.png" alt="마음쓰임"></div>
      <div class="footer-small">
        © 2026 마음쓰임 주식회사<br>
        Mind Tools Lab Co., Ltd.
      </div>
      <div class="social-links">
        <a href="https://instagram.com/mindtoolslab" target="_blank" class="social-btn" aria-label="인스타그램">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
        <a href="https://youtube.com/@mindtoolslab" target="_blank" class="social-btn" aria-label="유튜브">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"></path>
            <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor" stroke="none"></polygon>
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  var GRADIENTS = [
    'linear-gradient(160deg, #7B5EC8 0%, #4A2E80 100%)',
    'linear-gradient(160deg, #C87B5E 0%, #8A4A2E 100%)',
    'linear-gradient(160deg, #5E8AC8 0%, #2E4A8A 100%)',
    'linear-gradient(160deg, #C8A05E 0%, #8A6A2E 100%)',
    'linear-gradient(160deg, #6AC87B 0%, #2E8A3A 100%)',
    'linear-gradient(160deg, #C85E8A 0%, #8A2E5A 100%)'
  ];
  var SLIDE_GRADIENTS = [
    'linear-gradient(135deg, #5B3E96, #8A6BC8)',
    'linear-gradient(135deg, #8A6BC8, #E8694A)',
    'linear-gradient(135deg, #3D2A6B, #6B4FA0)',
    'linear-gradient(135deg, #E8694A, #5B3E96)',
    'linear-gradient(135deg, #6B4FA0, #C8A0E8)',
    'linear-gradient(135deg, #4A3080, #E8694A)'
  ];

  var siteData = null;

  function openModal(id) {
    document.getElementById(id).classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModalDirect(id) {
    document.getElementById(id).classList.remove('open');
    document.body.style.overflow = '';
  }
  function closeModal(e, id) {
    if (e.target === e.currentTarget) closeModalDirect(id);
  }

  function renderContent(items) {
    var grid = document.getElementById('contentGrid');
    grid.innerHTML = items.map(function(item) {
      var thumb = (item.images && item.images[0]) || item.image || '';
      var imgStyle = thumb ? ' style="background-image:url(\'' + thumb + '\');background-size:cover;background-position:center;"' : '';
      var imgText = thumb ? '' : '이미지 준비 중';
      var hasLink = !!item.link;
      var tag = hasLink ? 'a' : 'div';
      var linkAttrs = hasLink ? ' href="' + item.link + '" target="_blank" rel="noopener"' : '';
      var cursorStyle = hasLink ? '' : ' style="cursor:default;"';
      return '<' + tag + ' class="content-card ' + (item.colorClass || '') + '" data-cat="' + item.category + '"' + linkAttrs + cursorStyle + '>' +
        '<div class="content-card-img"' + imgStyle + '>' + imgText + '</div>' +
        '<div class="content-card-body">' +
        '<div class="content-cat">' + item.categoryLabel + '</div>' +
        '<h4>' + item.title + '</h4>' +
        '<div class="content-date">' + item.date + (hasLink ? ' · 글 보러 가기 →' : '') + '</div>' +
        '</div></' + tag + '>';
    }).join('');
  }

  fetch('./content.json')
    .then(function(res) { return res.json(); })
    .then(function(items) {
      items.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
      renderContent(items);
    })
    .catch(function(err) {
      document.getElementById('contentGrid').innerHTML =
        '<div style="grid-column:1/-1;text-align:center;color:#9B8AA8;padding:40px 0;">콘텐츠를 불러오지 못했습니다.</div>';
      console.error('content.json load failed', err);
    });

  function toggleFaq(item) {
    var wasOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(function(el) { el.classList.remove('open'); });
    if (!wasOpen) item.classList.add('open');
  }

  function filterContent(cat, btn) {
    document.querySelectorAll('.content-tab').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    document.querySelectorAll('.content-card').forEach(function(card) {
      if (cat === 'all' || card.dataset.cat === cat) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-bg.open').forEach(function(m) {
        m.classList.remove('open');
        document.body.style.overflow = '';
      });
    }
  });

  /* ---- 슬라이드쇼 (동적) ---- */
  var slideCurrent = 0;
  var slideTimer = null;
  function goSlide(n) {
    var slides = document.querySelectorAll('#slideshow .slide');
    var dots = document.querySelectorAll('#slideDots .dot');
    if (!slides.length) return;
    slides[slideCurrent].classList.remove('active');
    dots[slideCurrent].classList.remove('active');
    slideCurrent = n;
    slides[slideCurrent].classList.add('active');
    dots[slideCurrent].classList.add('active');
  }

  function photoBlock(photos) {
    var real = (photos || []).filter(function(p) { return !!p; });
    if (!real.length) {
      return ['1', '2', '3', '4'].map(function(n) { return '<div class="modal-photo">사진 ' + n + '</div>'; }).join('');
    }
    return real.map(function(p) { return '<div class="modal-photo"><img src="' + p + '" alt=""></div>'; }).join('');
  }

  function renderSite(data) {
    siteData = data;

    // HERO
    document.getElementById('heroTag').textContent = data.hero.tag;
    document.getElementById('heroTitle').innerHTML = data.hero.titleHtml;
    document.getElementById('heroCta').textContent = data.hero.ctaText;

    // SLIDESHOW (from projects)
    var slideshow = document.getElementById('slideshow');
    var dotsWrap = document.getElementById('slideDots');
    slideshow.innerHTML = data.projects.map(function(p, i) {
      var bgStyle = p.photos && p.photos[0] ? 'background-image:url(\'' + p.photos[0] + '\');background-size:cover;background-position:center;' : 'background:' + SLIDE_GRADIENTS[i % SLIDE_GRADIENTS.length] + ';';
      return '<div class="slide' + (i === 0 ? ' active' : '') + '">' +
        '<div class="slide-bg" style="' + bgStyle + '"></div>' +
        '<div class="slide-overlay"></div>' +
        '<div class="slide-content">' +
        '<div class="slide-num">' + String(i + 1).padStart(2, '0') + ' / ' + String(data.projects.length).padStart(2, '0') + '</div>' +
        '<div class="slide-title">' + p.title + '</div>' +
        '<div class="slide-sub">' + p.slideSub + '</div>' +
        '</div></div>';
    }).join('');
    dotsWrap.innerHTML = data.projects.map(function(p, i) {
      return '<button class="dot' + (i === 0 ? ' active' : '') + '" onclick="goSlide(' + i + ')"></button>';
    }).join('');
    slideCurrent = 0;
    if (slideTimer) clearInterval(slideTimer);
    slideTimer = setInterval(function() {
      goSlide((slideCurrent + 1) % data.projects.length);
    }, 3500);

    // PROGRAM CARDS
    document.getElementById('programGrid').innerHTML = data.programs.map(function(prog, i) {
      return '<div class="program-card">' +
        '<div class="program-card-img" style="background:' + GRADIENTS[i % GRADIENTS.length] + ';"><span class="program-card-tag">' + prog.tag + '</span></div>' +
        '<div class="program-card-body">' +
        '<h3>' + prog.title + '</h3>' +
        '<p>' + prog.desc + '</p>' +
        '<a href="#" class="program-card-cta" onclick="openModal(\'' + prog.linkTo + '\'); return false;">자세히 보기 →</a>' +
        '</div></div>';
    }).join('');

    // PARTNERS MARQUEE (duplicate list for seamless loop)
    function marqueeHtml(list) {
      var doubled = list.concat(list);
      return doubled.map(function(name) { return '<span class="partner-badge">' + name + '</span>'; }).join('');
    }
    document.getElementById('partnersRow1').innerHTML = marqueeHtml(data.partnersRow1);
    document.getElementById('partnersRow2').innerHTML = marqueeHtml(data.partnersRow2);

    // ARCHIVE STATS
    document.getElementById('archiveStats').innerHTML = data.archiveStats.map(function(s) {
      return '<div class="stat">' +
        '<div class="num' + (s.small ? ' small' : '') + '">' + s.num + '<span class="unit">' + s.unit + '</span></div>' +
        '<div class="label">' + s.label + '</div>' +
        '</div>';
    }).join('');

    // GALLERY
    document.getElementById('galleryGrid').innerHTML = data.projects.map(function(p, i) {
      var bgStyle = p.photos && p.photos[0] ? 'background-image:url(\'' + p.photos[0] + '\');background-size:cover;background-position:center;' : 'background:' + GRADIENTS[i % GRADIENTS.length] + ';';
      return '<div class="gallery-item" style="' + bgStyle + '" onclick="openModal(\'' + p.id + '\')">' +
        '<div class="gallery-ph">' +
        '<div class="ph-title">' + p.title + '</div>' +
        '<div class="ph-year">' + p.yearLabel + '</div>' +
        '</div>' +
        '<div class="gallery-overlay"><span>자세히 보기 →</span></div>' +
        '</div>';
    }).join('');

    // MODALS
    document.getElementById('modalsContainer').innerHTML = data.projects.map(function(p) {
      return '<div class="modal-bg" id="' + p.id + '" onclick="closeModal(event,\'' + p.id + '\')">' +
        '<div class="modal">' +
        '<button class="modal-close" onclick="closeModalDirect(\'' + p.id + '\')">✕</button>' +
        '<div class="modal-title">' + p.title + '</div>' +
        '<div class="modal-sub">' + p.modalSub + '</div>' +
        '<div class="modal-photos">' + photoBlock(p.photos) + '</div>' +
        '<div class="modal-desc">' + p.modalDesc + '</div>' +
        '</div></div>';
    }).join('');

    // FAQ
    document.getElementById('faqList').innerHTML = data.faq.map(function(item) {
      return '<div class="faq-item" onclick="toggleFaq(this)">' +
        '<div class="faq-question"><span>' + item.q + '</span><span class="faq-icon">+</span></div>' +
        '<div class="faq-answer"><p>' + item.a + '</p></div>' +
        '</div>';
    }).join('');

    // FOOTER
    document.getElementById('footerTitle').innerHTML = data.footer.titleHtml;
    document.getElementById('footerDesc').innerHTML = data.footer.descHtml;
    var emailLink = document.getElementById('footerEmailLink');
    emailLink.href = 'mailto:' + data.footer.email;
  }

  fetch('./site-data.json')
    .then(function(res) { return res.json(); })
    .then(renderSite)
    .catch(function(err) {
      console.error('site-data.json load failed', err);
    });
</script>

</body>
</html>
